server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets con hash de Next.js: cache permanente
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML sin cache para que los cambios se vean al instante
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Export estatico: /catalogo-efectos sirve catalogo-efectos.html
    # El =404 final es necesario: apuntar a /404.html devolveria status 200.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
